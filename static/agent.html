<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consola · Harbor Desk</title>
  <style>html.i18n-pending body{visibility:hidden}</style>
  <script>
    (function () {
      var lang = "es";
      try {
        if (localStorage.getItem("hd_lang") === "pt") lang = "pt";
      } catch (e) {}
      document.documentElement.lang = lang;
      document.documentElement.classList.add("i18n-pending");
      setTimeout(function () {
        document.documentElement.classList.remove("i18n-pending");
      }, 1200);
    })();
  </script>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-tour-page="agent">
  <header>
    <div>
      <div class="title-line">
        <h1 id="page-title">Consola del agente</h1>
        <span id="test-badge" class="test-badge" hidden>MODO PRUEBA</span>
      </div>
      <p class="lede" id="lede">Cola de casos con el paquete verificado. No hay texto crudo del cliente.</p>
    </div>
    <nav>
      <a href="/">Cliente</a>
      <a href="/agent">Consola</a>
      <a href="/metrics">Métricas</a>
      <button type="button" id="lang">Español</button>
      <button type="button" id="tour">¿Cómo funciona?</button>
    </nav>
  </header>
  <main>
    <div class="row">
      <input id="token" placeholder="Token del agente" />
      <button id="load" class="primary" type="button">Ver cola</button>
    </div>
    <section id="queue"></section>
  </main>
  <script src="/static/js/agent.js"></script>
  <script src="/static/js/tour.js"></script>
</body>
</html>
