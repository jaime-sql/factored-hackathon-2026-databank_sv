<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Métricas · Harbor Desk</title>
  <style>html.i18n-pending body{visibility:hidden}</style>
  <script>
    (function () {
      var lang = "es";
      try {
        if (localStorage.getItem("hd_lang") === "pt") lang = "pt";
      } catch (e) {}
      document.documentElement.lang = lang;
      document.documentElement.classList.add("i18n-pending");
      setTimeout(function () {
        document.documentElement.classList.remove("i18n-pending");
      }, 1200);
    })();
  </script>
  <script src="/static/js/catalog.js"></script>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-tour-page="metrics">
  <header>
    <div>
      <div class="title-line">
        <h1 id="page-title">Métricas</h1>
        <span id="test-badge" class="test-badge" hidden>MODO PRUEBA</span>
      </div>
      <p class="lede" id="lede">El tablero deja fuera el tráfico de evaluación y el de prueba. Las tasas de seguridad que necesitan etiquetas viven en el informe fuera de línea.</p>
    </div>
    <nav>
      <a href="/">Cliente</a>
      <a href="/agent">Consola</a>
      <a href="/metrics">Métricas</a>
      <button type="button" id="lang">Español</button>
      <button type="button" id="tour">¿Cómo funciona?</button>
    </nav>
  </header>
  <main>
    <label class="toggle">
      <input id="include-eval" type="checkbox" />
      <span id="eval-label">Muestra de demostración (enriquecida en fraude, tasa de riesgo alto cerca de 11 veces la de los datos completos)</span>
    </label>
    <div id="tiles" class="grid"></div>
    <section id="health" hidden></section>
    <section id="trust" hidden></section>
    <section id="simulator" hidden></section>
    <section id="fairness" hidden></section>
    <details id="raw-wrap" class="raw-wrap">
      <summary id="raw-toggle">Ver JSON</summary>
      <pre id="raw"></pre>
    </details>
  </main>
  <script src="/static/js/metrics.js"></script>
  <script src="/static/js/tour.js"></script>
</body>
</html>
