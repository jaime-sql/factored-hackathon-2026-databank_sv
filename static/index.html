<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harbor Desk</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-tour-page="client">
  <header>
    <div>
      <h1 id="page-title">Harbor Desk</h1>
      <p class="lede" id="lede">Un cargo a la vez. El asistente no mueve dinero: explica, bloquea la tarjeta solo si usted lo confirma, o pasa el caso a una persona.</p>
    </div>
    <nav>
      <a href="/">Cliente</a>
      <a href="/agent">Consola</a>
      <a href="/metrics">Métricas</a>
      <button type="button" id="lang">Español</button>
      <button type="button" id="tour">¿Cómo funciona?</button>
    </nav>
  </header>
  <main>
    <section id="personas" class="row"></section>
    <section id="charges"></section>
    <form id="composer" class="row">
      <input id="message" type="text" maxlength="500" autocomplete="off" placeholder="Mensaje" />
      <button type="submit" id="send">Enviar</button>
    </form>
    <section id="thread"></section>
  </main>
  <script src="/static/js/desk.js"></script>
  <script src="/static/js/tour.js"></script>
</body>
</html>
